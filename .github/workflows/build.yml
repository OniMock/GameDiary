name: Build GameDiary PSP

on:
  push:
    branches: [ main, master ]
    paths:
      - 'VERSION'
      - 'src/**'
      - 'Makefile*'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest

    steps:
      # -------------------------------------------------------
      # 📥 Checkout
      # -------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # 📦 Dependecies
      # -------------------------------------------------------
      - name: Install dependencies
        run: |
          apk add --no-cache build-base python3 zip

      # -------------------------------------------------------
      # 🔍 Validate Language Keys
      # -------------------------------------------------------
      - name: Validate Language Keys
        run: |
          python3 .github/scripts/check_lang_keys.py

      # -------------------------------------------------------
      # 🛠️ Build
      # -------------------------------------------------------
      - name: Build Project
        env:
          VERSION_URL: "http://${{ secrets.VPS_SSH_HOST }}/version.json"
        run: |
          export PSPSDK=$(psp-config --pspsdk-path)
          export PSPDEV=$(psp-config --pspdev-path)
          export PATH=$PATH:$PSPDEV/bin

          make clean || true
          make

      # -------------------------------------------------------
      # 📦 Prepare artifact structure
      # -------------------------------------------------------
      - name: Prepare artifact structure
        run: |
          mkdir -p release/GameDiary

          # Copy PRX
          if [ -f GameDiary.prx ]; then
            cp GameDiary.prx release/
          else
            echo "❌ GameDiary.prx not found"
            exit 1
          fi

          # Copy EBOOT
          if [ -f EBOOT.PBP ]; then
            cp EBOOT.PBP release/GameDiary/EBOOT.PBP
          else
            echo "❌ EBOOT.PBP not found"
            exit 1
          fi

          echo "📂 Final structure:"
          find release -type f -exec ls -lh {} \;

      # -------------------------------------------------------
      # 📦 Create ZIP
      # -------------------------------------------------------
      - name: Create ZIP
        run: |
          # Zip manually so the release job can attach it as-is
          cd release
          zip -r ../GameDiary.zip .
          cd ..
          echo "📦 ZIP contents:"
          unzip -l GameDiary.zip

      # -------------------------------------------------------
      # 📤 Upload artifact
      # -------------------------------------------------------
      # Upload the raw .zip file wrapped in a folder named 'GameDiary'.
      # upload-artifact@v4 always re-zips what you give it, so passing a
      # pre-built .zip would cause a zip-in-zip. Instead we upload the
      # contents of the release/ folder; the action compresses them into
      # the downloadable artifact automatically.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameDiary
          path: release/

      # -------------------------------------------------------
      # 🛠️ Build Debug Version
      # -------------------------------------------------------
      - name: Build Debug
        env:
          VERSION_URL: "http://${{ secrets.VPS_SSH_HOST }}/version.json"
        run: |
          export PSPSDK=$(psp-config --pspsdk-path)
          export PSPDEV=$(psp-config --pspdev-path)
          export PATH=$PATH:$PSPDEV/bin

          make clean || true
          make debug

      # -------------------------------------------------------
      # 📦 Prepare Debug artifact
      # -------------------------------------------------------
      - name: Prepare Debug artifact
        run: |
          mkdir -p release_debug/GameDiary
          cp GameDiary.prx release_debug/
          cp EBOOT.PBP release_debug/GameDiary/EBOOT.PBP
          
          cd release_debug
          zip -r ../GameDiaryDebug.zip .
          cd ..

      - name: Upload Debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameDiaryDebug
          path: GameDiaryDebug.zip

  # ===========================================================
  # 🚀 AUTOMATIC RELEASE
  # ===========================================================
  release:
    name: Create GitHub Release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------------------------------------
      # 🔢 Version from Makefile_App
      # -------------------------------------------------------
      - name: Get project version
        id: get_version
        run: |
          VERSION=$(head -n 1 VERSION | tr -d ' \n')
          CODENAME=$(sed -n '2p' VERSION | tr -d ' \n')
          if [ -z "$CODENAME" ]; then CODENAME="Skyfall"; fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "codename=$CODENAME" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      # -------------------------------------------------------
      # 🏷️ Check if tag exists
      # -------------------------------------------------------
      - name: Check if tag exists
        id: check_tag
        run: |
          git fetch --tags
          if git tag -l "${{ steps.get_version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # -------------------------------------------------------
      # 📝 Generate version.json (for PSP network check)
      # -------------------------------------------------------
      - name: Generate version.json
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          CODENAME="${{ steps.get_version.outputs.codename }}"
          DATE=$(date +'%Y-%m-%d')
          URL="https://github.com/${{ github.repository }}/releases/download/v$VERSION/GameDiary.zip"
          
          echo "{\"version\":\"$VERSION\",\"codename\":\"$CODENAME\",\"release_date\":\"$DATE\",\"url\":\"$URL\",\"mandatory\":false}" > version.json
          
          mkdir -p deploy_out
          cp version.json deploy_out/

      # -------------------------------------------------------
      # 📤 Upload version.json to Production (GCP VPS via SFTP)
      # -------------------------------------------------------
      - name: Upload version.json to Production
        if: steps.check_tag.outputs.exists == 'false'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USERNAME }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          protocol: sftp
          port: 22
          local-dir: ./deploy_out/
          server-dir: /var/www/html/

      # -------------------------------------------------------
      # 📥 Download artifact
      # -------------------------------------------------------
      - name: Download artifact
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: GameDiary
          # Extract into a known subdirectory to avoid collisions
          path: artifact/

      # Re-zip the extracted contents so the release attachment is a .zip
      - name: Repack artifact as ZIP
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          cd artifact
          zip -r ../GameDiary.zip .
          cd ..
          echo "📦 Release ZIP:"
          unzip -l GameDiary.zip

      # -------------------------------------------------------
      # 📝 Generate Changelog
      # -------------------------------------------------------
      - name: Generate Changelog
        if: steps.check_tag.outputs.exists == 'false'
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .github/scripts/cliff.toml
          args: --unreleased --strip header --tag ${{ steps.get_version.outputs.tag }} --output CHANGELOG.tmp.md

      - name: Update CHANGELOG.md (prepend)
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          if [ -f CHANGELOG.md ]; then
            cat CHANGELOG.tmp.md CHANGELOG.md > CHANGELOG.new.md
            mv CHANGELOG.new.md CHANGELOG.md
          else
            mv CHANGELOG.tmp.md CHANGELOG.md
          fi

          rm -f CHANGELOG.tmp.md

      - name: Commit changelog
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "onimock-actions"
          git config user.email "onimock-actions@github.com"

          git add CHANGELOG.md

          git commit -m "chore(release): update changelog ${{ steps.get_version.outputs.tag }} [skip cliff]" || echo "No changes"

          git push origin HEAD:${{ github.ref_name }}


      # -------------------------------------------------------
      # 🏷️ Create tag
      # -------------------------------------------------------
      - name: Create tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "onimock-actions"
          git config user.email "onimock-actions@github.com"
          git tag ${{ steps.get_version.outputs.tag }}
          git push origin ${{ steps.get_version.outputs.tag }}

      # -------------------------------------------------------
      # 🚀 Create release
      # -------------------------------------------------------
      - name: Create Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: GameDiary ${{ steps.get_version.outputs.tag }} - ${{ steps.get_version.outputs.codename }}
          body: |
            ## 🎮 GameDiary PSP - ${{ steps.get_version.outputs.codename }}

            New version available.

            ---

            ## 📦 Download

            * GameDiary.zip (PRX + EBOOT)
              https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.tag }}/GameDiary.zip

            ---

            ## ⚙️ Installation

            ### 📌 Plugin (GameDiary.prx)

            1. Copy `GameDiary.prx` to:

            ```
            /SEPLUGINS/
            ```

            2. Enable the plugin in ARK-4:

            * For PSP games:

            ```
            ms0:/SEPLUGINS/GameDiary.prx 1
            ```

            (or `ef0:/` on PSP Go)

            * For POPS (PS1):

            ```
            ms0:/SEPLUGINS/GameDiary.prx 1
            ```

            ---

            ### 🎮 Application (EBOOT)

            1. Copy the `GameDiary` folder to:

            ```
            /PSP/GAME/
            ```

            2. Final structure:

            ```
            PSP/
              GAME/
                GameDiary/
                  EBOOT.PBP
            ```

            ---

            ## 📝 Changelog

            ${{ steps.git-cliff.outputs.content }}
          files: GameDiary.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
